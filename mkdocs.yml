site_name: R-Type
site_description: Networked R-Type shoot'em up built on the Aegis2D engine
site_url: https://rtype-docs.pages.dev/
repo_url: https://github.com/Aegis2D-Dev/project-rtype
repo_name: Aegis2D-Dev/project-rtype
edit_uri: edit/develop/docs/
copyright: Aegis2D-Dev contributors, MIT License

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# Doxygen inputs and tool files live in docs/ but are not site pages.
exclude_docs: |
  api-mainpage.md
  Doxyfile
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Play: play.md
  - Architecture: architecture.md
  - Gameplay: gameplay.md
  - How-to guides:
      - Common tasks: how-to.md
      - Add an enemy type: add-an-enemy.md
  - API reference: https://rtype-docs.pages.dev/api/
  - Engine documentation: https://aegis2d-docs.pages.dev/
  - Development:
      - Contributing: https://github.com/Aegis2D-Dev/project-rtype/blob/develop/CONTRIBUTING.md
      - Changelog: https://github.com/Aegis2D-Dev/project-rtype/blob/develop/CHANGELOG.md
