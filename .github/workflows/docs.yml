name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'game/include/**', '.github/workflows/docs.yml']
  push:
    branches: [develop]
    paths: ['docs/**', 'mkdocs.yml', 'game/include/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site and API reference
    runs-on: [self-hosted, nixos]
    container:
      image: ghcr.io/aegis2d-dev/aegis2d-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The runner's Node.js (used by the actions) links into /nix/store.
      volumes: ['/nix/store:/nix/store:ro']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install MkDocs
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site
        run: mkdocs build --strict
      - name: Build the API reference into site/api
        run: |
          mkdir -p build
          doxygen docs/Doxyfile
          cp -r build/doxygen/html site/api
      # Downloadable from the run page, to review a pull request's docs without deploying.
      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, nixos]
    container:
      image: node:24
      volumes: ['/nix/store:/nix/store:ro']
    timeout-minutes: 10
    environment:
      name: documentation
      url: https://rtype-docs.pages.dev
    steps:
      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: documentation-site
          path: site
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. See CONTRIBUTING.md (Documentation)."
            exit 1
          fi
          npx --yes wrangler@4.146.0 pages deploy site --project-name=rtype-docs --branch=main --commit-dirty=true
