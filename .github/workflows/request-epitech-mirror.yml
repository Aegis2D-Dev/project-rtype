name: Request Epitech mirror

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: request-epitech-mirror
  cancel-in-progress: false

jobs:
  request:
    runs-on: [self-hosted, nixos]
    container:
      image: ghcr.io/aegis2d-dev/aegis2d-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 5
    steps:
      - name: Request centralized assembly and validation
        env:
          GH_TOKEN: ${{ secrets.EPITECH_MIRROR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set EPITECH_MIRROR_TOKEN with access to Aegis2D-Dev/aegis2d."
            exit 1
          fi
          gh api --method POST repos/Aegis2D-Dev/aegis2d/dispatches -f event_type=epitech-sync-requested
