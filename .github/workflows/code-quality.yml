name: Code quality

on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

# The engine (Aegis2D-Dev/aegis2d) is private: the build jobs let git fetch it with
# EPITECH_MIRROR_TOKEN, which already has access to it for the Epitech mirror.
#
# Linux jobs run on the self-hosted NixOS runners, inside the aegis2d-ci image (built from
# Aegis2D-Dev/aegis2d .github/ci-image). The runner's Node.js (used by the actions) links
# into /nix/store, so the store is mounted read-only.

jobs:
  format:
    name: Format (clang-format)
    runs-on: [self-hosted, nixos]
    container:
      image: ghcr.io/aegis2d-dev/aegis2d-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes: ['/nix/store:/nix/store:ro']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install clang-format
        run: python -m pip install -r tools/requirements.txt
      - name: Check formatting
        run: bash tools/format.sh --check

  build:
    name: Build, test and lint (Linux)
    runs-on: [self-hosted, nixos]
    container:
      image: ghcr.io/aegis2d-dev/aegis2d-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes: ['/nix/store:/nix/store:ro']
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Give git access to the engine
        env:
          TOKEN: ${{ secrets.EPITECH_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set EPITECH_MIRROR_TOKEN with read access to Aegis2D-Dev/aegis2d."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/Aegis2D-Dev/".insteadOf "https://github.com/Aegis2D-Dev/"
      # github.workspace is the host path in a container job; GITHUB_WORKSPACE is the container one.
      - name: Point CPM at the workspace cache
        run: echo "CPM_SOURCE_CACHE=$GITHUB_WORKSPACE/.cache/cpm" >> "$GITHUB_ENV"
      - name: Cache CPM sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install build prerequisites
        run: |
          python -m pip install cmake==3.31.6 -r tools/requirements.txt
          python -m pip install -r cmake/requirements.txt
      - name: Configure and build the server, the client and the tests
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAEGIS2D_WARNINGS_AS_ERRORS=ON \
            -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build --parallel
      - name: Run the tests
        run: ctest --test-dir build --output-on-failure
      - name: Run the binaries
        run: |
          ./build/r-type_server --version
          ./build/r-type_server
          ./build/r-type_client --version
      - name: Run clang-tidy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash tools/lint.sh build

  windows:
    name: Build and test (Windows, MSVC toolchain)
    runs-on: [self-hosted, windows]
    timeout-minutes: 50
    # The Windows runners keep their disk between jobs: CPM sources live in a machine-wide
    # cache (CPM locks it) and the build tree stays outside the checkout, which
    # actions/checkout cleans, so configure and build are incremental.
    env:
      CPM_SOURCE_CACHE: C:\cpm-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Give git access to the engine
        env:
          TOKEN: ${{ secrets.EPITECH_MIRROR_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            Write-Output "::error::Set EPITECH_MIRROR_TOKEN with read access to Aegis2D-Dev/aegis2d."
            exit 1
          }
          # The runner is persistent: keep the token in this job's temp directory, not in the user's gitconfig.
          $config = Join-Path $env:RUNNER_TEMP gitconfig
          "GIT_CONFIG_GLOBAL=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:GIT_CONFIG_GLOBAL = $config
          git config --global url."https://x-access-token:$($env:TOKEN)@github.com/Aegis2D-Dev/".insteadOf "https://github.com/Aegis2D-Dev/"
      - name: Keep the build tree between jobs
        run: '"BUILD_DIR=$env:RUNNER_WORKSPACE\build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Install build prerequisites
        run: python -m pip install cmake==4.4.3 -r cmake/requirements.txt
      - name: Configure the server, the client and the tests
        run: cmake -S . -B "$env:BUILD_DIR" -A x64 -T ClangCL -DAEGIS2D_WARNINGS_AS_ERRORS=ON -DPython_EXECUTABLE="$((Get-Command python).Source)"
      - name: Build
        run: cmake --build "$env:BUILD_DIR" --config Debug --parallel
      - name: Run the tests
        run: ctest --test-dir "$env:BUILD_DIR" -C Debug --output-on-failure
      - name: Run the binaries
        run: |
          & "$env:BUILD_DIR\r-type_server.exe" --version
          & "$env:BUILD_DIR\r-type_client.exe" --version

  sanitize:
    name: Tests with ASan and UBSan (Linux)
    runs-on: [self-hosted, nixos]
    container:
      image: ghcr.io/aegis2d-dev/aegis2d-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes: ['/nix/store:/nix/store:ro']
    timeout-minutes: 40
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Give git access to the engine
        env:
          TOKEN: ${{ secrets.EPITECH_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set EPITECH_MIRROR_TOKEN with read access to Aegis2D-Dev/aegis2d."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/Aegis2D-Dev/".insteadOf "https://github.com/Aegis2D-Dev/"
      # github.workspace is the host path in a container job; GITHUB_WORKSPACE is the container one.
      - name: Point CPM at the workspace cache
        run: echo "CPM_SOURCE_CACHE=$GITHUB_WORKSPACE/.cache/cpm" >> "$GITHUB_ENV"
      - name: Cache CPM sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install build prerequisites
        run: |
          python -m pip install cmake==3.31.6
          python -m pip install -r cmake/requirements.txt
      - name: Configure and build with sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DAEGIS2D_SANITIZE=ON -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build --parallel
      - name: Run the tests
        run: ctest --test-dir build --output-on-failure
