name: Bug report
description: Something in the game does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, including the full error message or log.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cmake --preset linux-debug
        2. cmake --build build/linux-debug
        3. ./build/linux-debug/r-type_server
        4. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or branch
      placeholder: develop @ 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine commit
      description: The engine's `develop` commit the game was built with (`build/<preset>/_deps/aegis2d-src`).
      placeholder: develop @ 6265aae
  - type: input
    id: compiler
    attributes:
      label: Compiler and CMake versions
      placeholder: clang 18, CMake 3.31
